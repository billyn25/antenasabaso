name: Integrar cierre de publicación comprobado
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integrar-cierre-abaso
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar conversión puntual de fotografías e icono aprobados
        run: |
          node scripts/build.mjs
          python3 -m pip install 'Pillow==12.3.0' 'CairoSVG==2.8.2'
      - name: Incorporar originales verificados y cambios probados
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request, hashlib, json, io, base64, zlib, subprocess
          from PIL import Image
          import cairosvg
          root = pathlib.Path('.')
          gallery = root/'assets/gallery'
          expected = {
            'tdt':'d15dac6c2773c338031fdf517bee60deb397aa919241231a3c2886065c05d8ef',
            'videoportero':'468f73ea4cde1ca5192720bc30cc0eb734bfed9e223791364d49935fa34cbbc6',
            'electricidad':'46f612e245d3b193e9c3b4e8b062fae1999a7b956f8f23f49e3c0b7b26b2a875'
          }
          sources=[]
          for name, digest in expected.items():
              legacy=f'/img/{name}.jpg'
              req=urllib.request.Request('https://www.antenasabaso.com'+legacy, headers={'User-Agent':'Abaso-migration-audit'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data=response.read()
              assert hashlib.sha256(data).hexdigest()==digest, f'La fotografía original ha cambiado: {name}'
              image=Image.open(io.BytesIO(data)).convert('RGB')
              image.thumbnail((960,960))
              dest=gallery/f'{name}-original.webp'
              image.save(dest,format='WEBP',quality=76,method=6)
              sources.append({'legacy':legacy,'file':'/'+str(dest),'width':image.width,'height':image.height,'sourceSha256':digest,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest()})
          (gallery/'sources.json').write_text(json.dumps(sources,ensure_ascii=False,indent=2)+'\n')
          icons=root/'assets/icons'
          icons.mkdir(exist_ok=True)
          cairosvg.svg2png(bytestring=(root/'dist/favicon.svg').read_bytes(),write_to=str(icons/'favicon.png'),output_width=192,output_height=192)
          Image.open(icons/'favicon.png').save(icons/'favicon.ico',sizes=[(16,16),(32,32),(48,48),(64,64)])
          encoded=''.join((root/f'.release-transfer/part{i}.b64').read_text() for i in range(1,5))
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='9eccebfda1049ae613830adcfac2e35524f78d8b85e790d253cd02b8248e5750', 'No coincide el cambio auditado'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
      - name: Pruebas y auditorías de preview y producción
        run: |
          npm test
          npm run build
          SITE_MODE=production CONTEXT=production NETLIFY=true URL=https://www.antenasabaso.com DEPLOY_PRIME_URL=https://www.antenasabaso.com npm run build
      - name: Guardar únicamente los archivos de la web probados
        run: |
          git rm -r .release-transfer
          git add README.md index.html package.json robots.txt scripts/audit.mjs scripts/build.mjs styles.css tests/release.test.mjs assets/gallery/tdt-original.webp assets/gallery/videoportero-original.webp assets/gallery/electricidad-original.webp assets/gallery/sources.json assets/icons/favicon.png assets/icons/favicon.ico
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepara Abaso para producción y corrige auditoría de migración'
          git push origin HEAD:main
