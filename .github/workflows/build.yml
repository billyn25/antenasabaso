name: Verificar Antenas Abaso
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: antenasabaso-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas de publicación, fotografías y cookies
        run: npm test
      - name: Generar y auditar preview protegida
        run: npm run build
        env:
          SITE_MODE: preview
      - name: Conservar preview comprobada
        run: cp -a dist .preview-check
      - name: Generar y auditar producción con el dominio real
        run: npm run build
        env:
          NETLIFY: 'true'
          CONTEXT: production
          SITE_MODE: production
          URL: https://www.antenasabaso.com
          DEPLOY_PRIME_URL: https://www.antenasabaso.com
      - name: Comprobar conteos finales
        run: |
          test "$(find dist/bizkaia -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 113
          test "$(find dist/gipuzkoa -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 88
          test "$(find dist/alava -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 51
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abaso-auditoria
          retention-days: 7
          include-hidden-files: true
          path: |
            .github/workflows/build.yml
            README.md
            index.html
            styles.css
            site.js
            package.json
            netlify.toml
            robots.txt
            scripts/
            tests/
            content/
            assets/
            dist/
            .preview-check/
